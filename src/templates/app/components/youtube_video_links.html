{% if video.source == "youtube" and video.youtube_video_id %}
  <button type="button" class="youtube-comments-trigger{% if compact %} youtube-video-action-compact{% endif %}"
          aria-label="Comments" aria-haspopup="dialog" title="Comments"
          data-youtube-comments-url="{% url 'youtube_comments' video.id %}" data-video-title="{{ video.title }}">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/>
      <path d="M9 11h6"/>
    </svg>
  </button>
  <a class="youtube-watch-link{% if compact %} youtube-video-action-compact{% endif %}"
     href="https://www.youtube.com/watch?v={{ video.youtube_video_id|urlencode }}"
     target="_blank" rel="noopener noreferrer" aria-label="Open on YouTube in a new tab" title="Open on YouTube">
    <svg width="20" height="14" viewBox="0 0 24 17" aria-hidden="true">
      <rect width="24" height="17" rx="4" fill="#ff0033"/>
      <path d="m9.5 5 6 3.5-6 3.5z" fill="white"/>
    </svg>
  </a>
{% endif %}
