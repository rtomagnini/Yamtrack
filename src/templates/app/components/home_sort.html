{% load app_tags %}

<div id="home-sort" class="relative" x-data="{ open: false }"
     {% if out_of_band %}hx-swap-oob="outerHTML"{% endif %}>
  <button id="home-sort-button"
          type="button"
          @click="open = !open"
          :aria-expanded="open.toString()"
          @keydown.escape="open = false"
          @click.outside="open = false"
          class="flex items-center gap-2 px-4 py-2 bg-[#39404b] hover:bg-[#454d5a] rounded-md transition-colors cursor-pointer">
    <svg xmlns="http://www.w3.org/2000/svg"
         width="24"
         height="24"
         viewBox="0 0 24 24"
         fill="none"
         stroke="currentColor"
         stroke-width="2"
         stroke-linecap="round"
         stroke-linejoin="round"
         class="w-4 h-4">
      <path d="m21 16-4 4-4-4"></path>
      <path d="M17 20V4"></path>
      <path d="m3 8 4-4 4 4"></path>
      <path d="M7 4v16"></path>
    </svg>
    <span class="text-sm font-medium">{{ current_sort|no_underscore|title }}</span>
    <svg xmlns="http://www.w3.org/2000/svg"
         width="24"
         height="24"
         viewBox="0 0 24 24"
         fill="none"
         stroke="currentColor"
         stroke-width="2"
         stroke-linecap="round"
         stroke-linejoin="round"
         class="w-4 h-4 text-gray-400">
      <path d="m6 9 6 6 6-6"></path>
    </svg>
  </button>
  <div x-cloak x-show="open"
       x-transition:enter="transition ease-out duration-100"
       x-transition:enter-start="transform opacity-0 scale-95"
       x-transition:enter-end="transform opacity-100 scale-100"
       x-transition:leave="transition ease-in duration-75"
       x-transition:leave-start="transform opacity-100 scale-100"
       x-transition:leave-end="transform opacity-0 scale-95"
       class="absolute right-0 mt-2 py-1 w-48 bg-[#39404b] rounded-md shadow-lg overflow-hidden z-10 border border-gray-700">
    {% for value, label in sort_choices %}
      <a href="{% url 'home' %}?sort={{ value }}"
         hx-get="{% url 'home' %}?sort={{ value }}"
         hx-target="#home-feed"
         hx-swap="outerHTML show:none"
         hx-include="#home-page-state"
         data-home-sort-option
         {% if current_sort == value %}aria-current="true"{% endif %}
         class="block w-full px-4 py-2 text-left text-sm transition-colors {% if current_sort == value %}bg-indigo-600 text-white font-medium{% else %}text-gray-300 hover:bg-[#454d5a] hover:text-white{% endif %}">
        {{ label }}
      </a>
    {% endfor %}
  </div>
  <p data-home-error hidden role="alert" class="mt-2 text-sm text-red-300">
    Could not change the sort order. Try again.
  </p>
</div>
