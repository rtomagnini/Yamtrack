{% load app_tags %}

<div id="home-feed" class="space-y-8">
  {% for media_type, media_list in preferred_sections|add:remaining_sections %}
    {% include "app/components/home_section.html" with priority_posters=forloop.first %}
  {% endfor %}
  <div id="home-empty-state"
       tabindex="-1"
       {% if preferred_sections or remaining_sections %}hidden{% endif %}>
    <div class="flex flex-col items-center justify-center py-32 px-4 theme-surface rounded-lg">
      <div class="theme-field rounded-full p-4 w-16 h-16 mx-auto mb-4 flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg"
             width="24"
             height="24"
             viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2"
             stroke-linecap="round"
             stroke-linejoin="round"
             class="w-8 h-8 text-gray-400">
          <path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2" />
        </svg>
      </div>
      <h3 class="text-xl font-semibold mb-2">No media in progress</h3>
      <p class="text-gray-400 text-center max-w-md mb-4">Start tracking your progress by marking items as "In Progress".</p>
      <div class="pt-4">
        <a href="{{ 'tv'|sample_search }}"
           class="px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 transition-colors">Browse Media</a>
      </div>
    </div>
  </div>
</div>
