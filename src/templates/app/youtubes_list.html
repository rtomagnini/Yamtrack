{% extends "base.html" %}
{% load static %}

{% block title %}Youtubes - Yamtrack{% endblock %}

{% block content %}
<h1 class="text-3xl font-bold mb-6">Youtubes</h1>

<div x-data="{ search: '{{ search }}', status: '{{ current_status }}', sort: '{{ current_sort }}', layout: '{{ current_layout|default:'grid' }}', statusLabels: { all: 'All', watched: 'Watched', unwatched: 'Unwatched' }, sortLabels: { title: 'Title', air_date: 'Air date', runtime: 'Runtime', end_date: 'End date' }, openStatus: false, openSort: false }">
  <form id="youtube-filter-form" x-ref="filterForm" class="hidden"
    hx-get="{% url 'youtubes' %}"
    hx-target="#youtube-content"
    hx-include="#youtube-filter-form"
    hx-trigger="change, submit">
    <input type="hidden" name="search" x-model="search">
    <input type="hidden" name="status" x-model="status">
    <input type="hidden" name="sort" x-model="sort">
    <input type="hidden" name="layout" x-model="layout">
  </form>
  <div class="filter-toolbar mb-6">
    <div class="filter-search">
      <input id="search" type="text" name="search" x-model="search" placeholder="Search videos..." autocomplete="on"
        class="filter-search-input"
        @input="$nextTick(() => $refs.filterForm.requestSubmit())"
        hx-indicator="#youtube-search-indicator">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400">
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.3-4.3"></path>
      </svg>
      <div id="youtube-search-indicator" class="htmx-indicator absolute right-3 top-1/2 transform -translate-y-1/2">
        <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-indigo-500"></div>
      </div>
    </div>
    <div class="filter-actions">
      <!-- Status Filter Dropdown -->
      <div class="relative" x-data="{ open: false }">
        <button type="button" class="filter-control cursor-pointer" :aria-expanded="open" @click="open = !open">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4">
            <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
          </svg>
          <span x-text="statusLabels[status] || status"></span>
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4">
            <path d="m6 9 6 6 6-6"></path>
          </svg>
        </button>
        <div class="filter-menu"
          x-cloak x-show="open" @click.outside="open = false"
          x-transition:enter="transition ease-out duration-100"
          x-transition:enter-start="transform opacity-0 scale-95"
          x-transition:enter-end="transform opacity-100 scale-100"
          x-transition:leave="transition ease-in duration-75"
          x-transition:leave-start="transform opacity-100 scale-100"
          x-transition:leave-end="transform opacity-0 scale-95">
          <button class="filter-option" :aria-pressed="status === 'all'" @click="status = 'all'; open = false; $nextTick(() => $refs.filterForm.requestSubmit())" type="button">All</button>
          <button class="filter-option" :aria-pressed="status === 'watched'" @click="status = 'watched'; open = false; $nextTick(() => $refs.filterForm.requestSubmit())" type="button">Watched</button>
          <button class="filter-option" :aria-pressed="status === 'unwatched'" @click="status = 'unwatched'; open = false; $nextTick(() => $refs.filterForm.requestSubmit())" type="button">Unwatched</button>
        </div>
      </div>
      <!-- Sort Dropdown -->
      <div class="relative" x-data="{ open: false }">
        <button type="button" class="filter-control cursor-pointer" :aria-expanded="open" @click="open = !open">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4">
            <path d="m21 16-4 4-4-4"></path>
            <path d="M17 20V4"></path>
            <path d="m3 8 4-4 4 4"></path>
            <path d="M7 4v16"></path>
          </svg>
          <span x-text="sortLabels[sort] || sort"></span>
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4">
            <path d="m6 9 6 6 6-6"></path>
          </svg>
        </button>
        <div class="filter-menu filter-menu-end"
          x-cloak x-show="open" @click.outside="open = false"
          x-transition:enter="transition ease-out duration-100"
          x-transition:enter-start="transform opacity-0 scale-95"
          x-transition:enter-end="transform opacity-100 scale-100"
          x-transition:leave="transition ease-in duration-75"
          x-transition:leave-start="transform opacity-100 scale-100"
          x-transition:leave-end="transform opacity-0 scale-95">
          <button class="filter-option" :aria-pressed="sort === 'title'" @click="sort = 'title'; open = false; $nextTick(() => $refs.filterForm.requestSubmit())" type="button">Title</button>
          <button class="filter-option" :aria-pressed="sort === 'air_date'" @click="sort = 'air_date'; open = false; $nextTick(() => $refs.filterForm.requestSubmit())" type="button">Air date</button>
          <button class="filter-option" :aria-pressed="sort === 'runtime'" @click="sort = 'runtime'; open = false; $nextTick(() => $refs.filterForm.requestSubmit())" type="button">Runtime</button>
          <button class="filter-option" :aria-pressed="sort === 'end_date'" @click="sort = 'end_date'; open = false; $nextTick(() => $refs.filterForm.requestSubmit())" type="button">End date</button>
        </div>
      </div>
      <!-- Layout Toggle -->
      <div class="filter-segments filter-layout" role="group" aria-label="View layout">
        <button type="button"
          :aria-pressed="layout === 'grid'"
          title="Grid View"
          @click="layout = 'grid'; $nextTick(() => $refs.filterForm.requestSubmit())">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
            <rect width="7" height="7" x="3" y="3" rx="1"></rect><rect width="7" height="7" x="14" y="3" rx="1"></rect><rect width="7" height="7" x="14" y="14" rx="1"></rect><rect width="7" height="7" x="3" y="14" rx="1"></rect>
          </svg>
        </button>
        <button type="button"
          :aria-pressed="layout === 'table'"
          title="Table View"
          @click="layout = 'table'; $nextTick(() => $refs.filterForm.requestSubmit())">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
            <path d="M12 3v18"></path>
            <rect width="18" height="18" x="3" y="3" rx="2"></rect>
            <path d="M3 9h18"></path>
            <path d="M3 15h18"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div id="youtube-content">
    {% include "app/components/youtube_content.html" %}
  </div>
</div>
{% include "app/components/youtube_comments_dialog.html" %}
{% endblock %}
