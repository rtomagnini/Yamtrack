{% extends "base.html" %}
{% load app_tags %}

{% block title %}
  Home - Yamtrack
{% endblock title %}

{% block content %}
  <div id="home-browsing">
    <form id="home-page-state" hidden></form>
    <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-8">
      <h1 class="text-3xl font-bold text-center w-full sm:w-auto">In Progress</h1>
      {% include "app/components/home_sort.html" %}
    </div>

    {% include "app/components/home_feed.html" %}
  </div>
{% endblock content %}

{% block js %}
  <script>
    const homeBrowsing = document.getElementById('home-browsing');
    const homeRequests = new WeakMap();

    homeBrowsing.addEventListener('htmx:beforeRequest', event => {
      const { elt, xhr } = event.detail;
      const sorting = elt.matches('[data-home-sort-option]');
      const loadingMore = elt.matches('[data-home-load-more]');
      if (!sorting && !loadingMore) return;

      const section = elt.closest('[data-home-section]');
      const busySection = sorting
        ? homeBrowsing.querySelector('[data-progress-busy], [data-loading-more]')
        : section.dataset.progressBusy || section.dataset.loadingMore;
      if (homeBrowsing.dataset.sorting || busySection) {
        event.preventDefault();
        return;
      }

      const control = elt.closest(sorting ? '#home-sort' : '[data-home-pager]');
      const error = control.querySelector('[data-home-error]');
      const request = {
        kind: sorting ? 'sort' : 'more',
        hadFocus: document.activeElement === elt,
        cards: section?.querySelector('.media-grid').children.length,
      };
      homeRequests.set(xhr, request);
      error.hidden = true;
      if (sorting) homeBrowsing.dataset.sorting = 'true';
      else section.dataset.loadingMore = 'true';

      xhr.addEventListener('loadend', () => {
        if (sorting) delete homeBrowsing.dataset.sorting;
        else delete section.dataset.loadingMore;

        const ok = xhr.status === 200 && xhr.getResponseHeader('X-Home-Fragment') === request.kind;
        if (!ok) {
          error.hidden = false;
          return;
        }

        const emptyState = document.getElementById('home-empty-state');
        emptyState.hidden = Boolean(homeBrowsing.querySelector('[data-home-section]'));
        requestAnimationFrame(() => {
          if (request.position) window.scrollTo(...request.position);
          if (!request.hadFocus) return;

          const updatedSection = section && document.getElementById(section.id);
          const card = updatedSection?.querySelector('.media-grid').children[request.cards];
          const focusTarget = sorting ? document.getElementById('home-sort-button')
            : card?.querySelector('a[title]') || updatedSection || (emptyState.hidden ? null : emptyState);
          focusTarget?.focus({ preventScroll: true });
        });
      }, { once: true });
    });

    homeBrowsing.addEventListener('htmx:beforeSwap', event => {
      const { xhr } = event.detail;
      const request = homeRequests.get(xhr);
      if (!request) return;
      if (xhr.getResponseHeader('X-Home-Fragment') !== request.kind) {
        event.detail.shouldSwap = false;
        return;
      }
      request.position = [window.scrollX, window.scrollY];
    });

    document.addEventListener('alpine:init', () => {
      Alpine.data('homeProgress', () => ({
        busy: false,
        confirming: false,
        error: '',
        async change(operation, answer = '') {
          const widget = this.$root;
          const section = widget.closest('[data-home-section]');
          if (homeBrowsing.dataset.sorting || section.dataset.progressBusy || section.dataset.loadingMore) return;

          const hadFocus = section.contains(document.activeElement);
          this.busy = true;
          this.error = '';
          section.dataset.progressBusy = 'true';

          try {
            const response = await fetch(widget.dataset.progressUrl, {
              method: 'POST',
              headers: { 'X-CSRFToken': widget.dataset.csrfToken },
              body: new URLSearchParams({
                operation,
                confirm_completion: answer,
                episode_number: widget.dataset.nextEpisode,
                pending_videos: widget.dataset.pendingVideos,
                home_section: 'initial',
                shown: section.querySelector('[data-home-count]').value,
                sort: section.dataset.sort,
              }),
            });

            if (response.headers.get('content-type')?.includes('application/json')) {
              const data = await response.json();
              if (response.ok && data.requires_confirmation) {
                this.confirming = true;
                this.$nextTick(() => widget.querySelector('[x-show="confirming"] button').focus());
                return;
              }
              throw new Error(data.message);
            }
            if (!response.ok || response.redirected) throw new Error();

            const html = await response.text();
            const progressId = widget.parentElement.id;
            const restoreFocus = hadFocus && (
              document.activeElement === document.body || section.contains(document.activeElement)
            );
            htmx.swap(section, html, { swapStyle: 'outerHTML' });

            const emptyState = document.getElementById('home-empty-state');
            emptyState.hidden = Boolean(document.querySelector('[data-home-section]'));
            if (restoreFocus) {
              const progress = document.getElementById(progressId);
              const button = progress?.querySelector(`[data-progress-action="${operation}"]:not([disabled])`)
                || progress?.querySelector('[data-progress-action]:not([disabled])');
              const target = button || document.getElementById(section.id)
                || (emptyState.hidden ? document.querySelector('[data-home-section]') : emptyState);
              target?.focus({ preventScroll: true });
            }
          } catch (error) {
            this.error = error.message || 'Could not update progress. Refresh the page and try again.';
          } finally {
            delete section.dataset.progressBusy;
            this.busy = false;
          }
        },
      }));
    });
  </script>
{% endblock js %}
